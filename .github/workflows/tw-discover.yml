name: Discover Taiwan camera datasets

# One-off diagnostics for scripts/tw_merge.py: column names and category counts of city sources.
on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: City categories
        run: |
          python3 - <<'PY'
          import csv, io, subprocess, collections
          def get(u):
              r = subprocess.run(["curl","-fsSL","-A","Mozilla/5.0","--connect-timeout","20","-m","90",u], capture_output=True)
              b = r.stdout
              for e in ("utf-8-sig","cp950","big5"):
                  try: return b.decode(e)
                  except: pass
          srcs = {
            "taipei": "https://data.taipei/api/dataset/745b8808-061f-4f5b-9a62-da1590c049a9/resource/5012e8ba-5ace-4821-8482-ee07c147fd0a/download",
            "taoyuan": "https://opendata.tycg.gov.tw/api/dataset/46bd8de0-cb90-4149-a530-5f5b1751b450/resource/636bb62e-cc5b-4ad4-ac11-5849ad5c432d/download",
            "taichung": "https://newdatacenter.taichung.gov.tw/api/v1/no-auth/resource.download?rid=b3f58c63-53b3-4c01-8203-2a7afa08bb13",
          }
          for name, u in srcs.items():
              t = get(u) or ""
              rows = list(csv.DictReader(io.StringIO(t)))
              print("==", name, len(rows), "rows; columns:", list(rows[0].keys()) if rows else t[:300])
              for col in rows[0].keys() if rows else []:
                  c = collections.Counter(r.get(col,"") for r in rows)
                  if len(c) < 40: print("  ", col, dict(c.most_common(25)))
              for r in rows[:3]: print("   sample:", r)
          PY
      - name: Hualien spreadsheet
        run: |
          pip install --quiet openpyxl
          curl -sSL -A Mozilla/5.0 -m 90 -o hl.xlsx 'https://ws.hl.gov.tw/Download.ashx?u=LzAwMS9VcGxvYWQvNTE4L3JlbGZpbGUvMjI2MjkvMTY3NDc2LzE0NjIzNjE3LWJmM2ItNGM0ZS04Y2QzLTk1NDNhZjUxNmFiMS54bHN4&n=6Iqx6JOu57ij6K2m5a%2bf5bGA6Kit572u5Y2A6ZaT5ris6YCf5Z%2b35rOV5Zyw6bue5LiA6Ka96KGoLnhsc3g%3d'
          python3 -c "
          import openpyxl
          wb=openpyxl.load_workbook('hl.xlsx',data_only=True)
          for ws in wb.worksheets:
              print('== sheet',ws.title)
              for r in list(ws.iter_rows(values_only=True))[:40]: print('  ',r)
          "
