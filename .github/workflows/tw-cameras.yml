name: Taiwan speed cameras

# Builds the app's Taiwan speed-camera list: the National Police Agency's list plus city police
# open data (科技執法 speed cameras, 區間測速 sections), all 政府資料開放授權條款－第1版.
# See scripts/tw_merge.py. The app downloads the result weekly and bundles a copy for first launch.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/tw-cameras.yml", "scripts/tw_merge.py"]
  schedule:
    - cron: "41 2 * * 1"   # weekly, Monday 02:41 UTC

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and merge
        run: |
          set -euo pipefail
          pip install --quiet openpyxl
          python3 scripts/tw_merge.py tw_speed_cameras.csv report.txt
          rows=$(wc -l < tw_speed_cameras.csv)
          echo "rows: $rows"
          head -3 tw_speed_cameras.csv
          test "$rows" -gt 1000
          sha256sum tw_speed_cameras.csv | tee tw_speed_cameras.sha256
          cat report.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to the "tw-cameras" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view tw-cameras >/dev/null 2>&1 || gh release create tw-cameras --title "Taiwan speed cameras" \
            --notes "內政部警政署「測速執法設置點」(data.gov.tw/dataset/7320) merged with city police open data, 政府資料開放授權條款－第1版. Updated weekly."
          gh release upload tw-cameras report.txt --clobber
          gh release upload tw-cameras tw_speed_cameras.csv tw_speed_cameras.sha256 --clobber
