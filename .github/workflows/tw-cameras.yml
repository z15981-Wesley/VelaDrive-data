name: Taiwan speed cameras

# Mirrors the National Police Agency's speed-camera list (政府資料開放授權條款－第1版)
# so the app build can bundle a recent copy for first launch without a connection.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/tw-cameras.yml"]
  schedule:
    - cron: "41 2 * * 1"   # weekly, Monday 02:41 UTC

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download and check
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -m 120 -o tw_speed_cameras.csv \
            "https://opdadm.moi.gov.tw/api/v1/no-auth/resource/api/dataset/EA5E6FCD-B82D-43B7-A5CF-E9893253187E/resource/7AF37045-DAB0-43D8-A8D4-F0A9691C0B1A/download"
          rows=$(wc -l < tw_speed_cameras.csv)
          echo "rows: $rows"
          head -2 tw_speed_cameras.csv
          test "$rows" -gt 1000
          sha256sum tw_speed_cameras.csv | tee tw_speed_cameras.sha256
      - name: Publish to the "tw-cameras" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view tw-cameras >/dev/null 2>&1 || gh release create tw-cameras --title "Taiwan speed cameras" \
            --notes "Mirror of 內政部警政署「測速執法設置點」(data.gov.tw/dataset/7320), 政府資料開放授權條款－第1版. Updated weekly."
          gh release upload tw-cameras tw_speed_cameras.csv tw_speed_cameras.sha256 --clobber
