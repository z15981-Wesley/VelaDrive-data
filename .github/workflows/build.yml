name: Build offline packs

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Countries to rebuild: all, or e.g. 'us' or 'tw,cn'"
        default: all
  schedule:
    - cron: "17 3 2 * *"   # monthly, 2nd day 03:17 UTC

permissions:
  contents: write

concurrency:
  group: packs
  cancel-in-progress: false

jobs:
  region:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - { country: tw, part: all, only: "", source: asia/taiwan }
          - { country: cn, part: all, only: "", source: asia/china }
          - { country: us, part: al, only: "al", source: north-america/us/alabama }
          - { country: us, part: ak, only: "ak", source: north-america/us/alaska }
          - { country: us, part: az, only: "az", source: north-america/us/arizona }
          - { country: us, part: ar, only: "ar", source: north-america/us/arkansas }
          - { country: us, part: ca, only: "ca", source: north-america/us/california }
          - { country: us, part: co, only: "co", source: north-america/us/colorado }
          - { country: us, part: ct, only: "ct", source: north-america/us/connecticut }
          - { country: us, part: de, only: "de", source: north-america/us/delaware }
          - { country: us, part: dc, only: "dc", source: north-america/us/district-of-columbia }
          - { country: us, part: fl, only: "fl", source: north-america/us/florida }
          - { country: us, part: ga, only: "ga", source: north-america/us/georgia }
          - { country: us, part: hi, only: "hi", source: north-america/us/hawaii }
          - { country: us, part: id, only: "id", source: north-america/us/idaho }
          - { country: us, part: il, only: "il", source: north-america/us/illinois }
          - { country: us, part: in, only: "in", source: north-america/us/indiana }
          - { country: us, part: ia, only: "ia", source: north-america/us/iowa }
          - { country: us, part: ks, only: "ks", source: north-america/us/kansas }
          - { country: us, part: ky, only: "ky", source: north-america/us/kentucky }
          - { country: us, part: la, only: "la", source: north-america/us/louisiana }
          - { country: us, part: me, only: "me", source: north-america/us/maine }
          - { country: us, part: md, only: "md", source: north-america/us/maryland }
          - { country: us, part: ma, only: "ma", source: north-america/us/massachusetts }
          - { country: us, part: mi, only: "mi", source: north-america/us/michigan }
          - { country: us, part: mn, only: "mn", source: north-america/us/minnesota }
          - { country: us, part: ms, only: "ms", source: north-america/us/mississippi }
          - { country: us, part: mo, only: "mo", source: north-america/us/missouri }
          - { country: us, part: mt, only: "mt", source: north-america/us/montana }
          - { country: us, part: ne, only: "ne", source: north-america/us/nebraska }
          - { country: us, part: nv, only: "nv", source: north-america/us/nevada }
          - { country: us, part: nh, only: "nh", source: north-america/us/new-hampshire }
          - { country: us, part: nj, only: "nj", source: north-america/us/new-jersey }
          - { country: us, part: nm, only: "nm", source: north-america/us/new-mexico }
          - { country: us, part: ny, only: "ny", source: north-america/us/new-york }
          - { country: us, part: nc, only: "nc", source: north-america/us/north-carolina }
          - { country: us, part: nd, only: "nd", source: north-america/us/north-dakota }
          - { country: us, part: oh, only: "oh", source: north-america/us/ohio }
          - { country: us, part: ok, only: "ok", source: north-america/us/oklahoma }
          - { country: us, part: or, only: "or", source: north-america/us/oregon }
          - { country: us, part: pa, only: "pa", source: north-america/us/pennsylvania }
          - { country: us, part: ri, only: "ri", source: north-america/us/rhode-island }
          - { country: us, part: sc, only: "sc", source: north-america/us/south-carolina }
          - { country: us, part: sd, only: "sd", source: north-america/us/south-dakota }
          - { country: us, part: tn, only: "tn", source: north-america/us/tennessee }
          - { country: us, part: tx, only: "tx", source: north-america/us/texas }
          - { country: us, part: ut, only: "ut", source: north-america/us/utah }
          - { country: us, part: vt, only: "vt", source: north-america/us/vermont }
          - { country: us, part: va, only: "va", source: north-america/us/virginia }
          - { country: us, part: wa, only: "wa", source: north-america/us/washington }
          - { country: us, part: wv, only: "wv", source: north-america/us/west-virginia }
          - { country: us, part: wi, only: "wi", source: north-america/us/wisconsin }
          - { country: us, part: wy, only: "wy", source: north-america/us/wyoming }
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TARGETS: ${{ github.event.inputs.targets || 'all' }}
    steps:
      - name: Selected?
        id: pick
        run: |
          if [ "$TARGETS" = "all" ] || echo ",$TARGETS," | grep -q ",${{ matrix.country }},"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.pick.outputs.run == 'true'
      - name: Install osmium
        if: steps.pick.outputs.run == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: Download and filter extract
        if: steps.pick.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p geo
          curl -fsSL --retry 5 --retry-delay 20 -o in.pbf "https://download.geofabrik.de/${{ matrix.source }}-latest.osm.pbf"
          ls -lh in.pbf
          osmium tags-filter in.pbf w/maxspeed w/maxspeed:forward w/maxspeed:backward n/highway=speed_camera -o filtered.pbf --overwrite
          rm in.pbf
          osmium export filtered.pbf -c osmium-export.json -f geojsonseq --geometry-types=point,linestring -o geo/data.geojsonseq --overwrite
          ls -lh filtered.pbf geo/data.geojsonseq
      - name: Build pack
        if: steps.pick.outputs.run == 'true'
        run: >
          python3 scripts/build_packs.py --country ${{ matrix.country }} --input geo/data.geojsonseq
          --regions regions.json --work work --out out --only "${{ matrix.only }}" --part ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.run == 'true'
        with:
          name: packs-${{ matrix.country }}-${{ matrix.part }}
          path: out/
          retention-days: 3

  publish:
    needs: region
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packs-*
          path: out
          merge-multiple: true
      - name: Manifest (merged with the previous one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out prev
          gh release download packs -p manifest.json -D prev 2>/dev/null || true
          python3 scripts/publish.py out prev/manifest.json
      - name: Upload to the "packs" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view packs >/dev/null 2>&1 || gh release create packs --title "Offline packs" \
            --notes "Road speed limits and speed cameras for Vela Drive. Data © OpenStreetMap contributors, ODbL 1.0. Rebuilt monthly."
          if ls out/*.vdp >/dev/null 2>&1; then gh release upload packs out/*.vdp --clobber; fi
          gh release upload packs out/manifest.json --clobber
          # Remove packs the manifest no longer lists.
          keep=$(python3 -c "import json;m=json.load(open('out/manifest.json'));print('\n'.join(['manifest.json']+[r['file'] for c in m['countries'] for r in c['regions']]))")
          for asset in $(gh release view packs --json assets -q '.assets[].name'); do
            echo "$keep" | grep -qx "$asset" || gh release delete-asset packs "$asset" -y
          done
